<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Funnel+Sans:wght@300..800&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="fav.png" />
  <title>VISAP 2026 — Hero Background Blob (Oval Purple)</title>
  <script src="./main-blobs.js?v=4" defer></script>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-color: #0b0f19 !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      overflow: hidden !important;
    }
    main {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      width: 100% !important;
      height: 100% !important;
      padding: 24px !important;
      box-sizing: border-box !important;
    }
    #hero {
      position: relative !important;
      aspect-ratio: 210 / 297 !important;
      width: min(794px, 92vw, calc(92vh * 210 / 297)) !important;
      height: min(1123px, 92vh, calc(92vw * 297 / 210)) !important;
      background-color: var(--bg) !important;
      border-radius: 16px !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12) !important;
      overflow: hidden !important;
      display: block !important;
      padding: 0 !important;
      min-height: unset !important;
      max-height: unset !important;
      grid-template-columns: unset !important;
      grid-template-rows: unset !important;
    }
    #bg {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      border-radius: 15px !important;
    }
    #a4-badge {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Funnel Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      background: rgba(15, 20, 32, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 10;
      user-select: none;
      transition: opacity 0.3s ease;
    }
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      html, body, main {
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
      }
      #hero {
        width: 210mm !important;
        height: 297mm !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      #bg {
        border-radius: 0 !important;
      }
      #a4-badge {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section id="hero">
      <canvas id="bg"></canvas>
    </section>
  </main>
  <div id="a4-badge">A4 Vertical &bull; 210 &times; 297 mm</div>
</body>
</html>
